a,
.w-input,
.w-select,
.w-tab-link,
.w-nav-link,
.w-nav-brand,
.w-dropdown-btn,
.w-dropdown-toggle,
.w-slider-arrow-left,
.w-slider-arrow-right,
.w-dropdown-link {
  color: inherit;
  text-decoration: inherit;
  font-size: inherit;
}

/* Focus state style for keyboard navigation for the focusable elements */
*[tabindex]:focus-visible,
  input[type="file"]:focus-visible {
   outline: 0.125rem solid #4d65ff;
   outline-offset: 0.125rem;
}

/* Get rid of top margin on first element in any rich text element */
.w-richtext > :not(div):first-child, .w-richtext > div:first-child > :first-child {
  margin-top: 0 !important;
}

/* Get rid of bottom margin on last element in any rich text element */
.w-richtext>:last-child, .w-richtext ol li:last-child, .w-richtext ul li:last-child {
	margin-bottom: 0 !important;
}

/* Prevent all click and hover interaction with an element */
.pointer-events-off {
	pointer-events: none;
}

/* Enables all click and hover interaction with an element */
.pointer-events-on {
  pointer-events: auto;
}

/* Create a class of .div-square which maintains a 1:1 dimension of a div */
.div-square::after {
	content: "";
	display: block;
	padding-bottom: 100%;
}

/* Make sure containers never lose their center alignment */
.container-medium,.container-small, .container-large {
	margin-right: auto !important;
  margin-left: auto !important;
}


/* Apply "..." after 4 lines of text */
.text-style-4lines {
	display: -webkit-box;
	overflow: hidden;
	-webkit-line-clamp: 4;
	-webkit-box-orient: vertical;
}

/* Apply "..." after 3 lines of text */
.text-style-3lines {
	display: -webkit-box;
	overflow: hidden;
	-webkit-line-clamp: 3;
	-webkit-box-orient: vertical;
}

/* Apply "..." after 2 lines of text */
.text-style-2lines {
	display: -webkit-box;
	overflow: hidden;
	-webkit-line-clamp: 2;
	-webkit-box-orient: vertical;
}

/* Adds inline flex display */
.display-inlineflex {
  display: inline-flex;
}

/* These classes are never overwritten */
.hide {
  display: none !important;
}

/* Remove default Webflow chevron from form select */
select{
  -webkit-appearance:none;
}


sup
{
    top: 0;
    font-size: inherit;
    line-height: inherit;
    position: static;
    font-style: italic;
    font-weight: 600;

}

     Base HubSpot Form Styling
  ----------------------------- */

  .hubspot-form {
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .hbspt-form {
    width: 100%;
    height: 100%;
    position: relative;
    font-family: var(--_typography---font-styles--body);
    color: var(--text--primary);
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .hbspt-form form {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    row-gap: 1.5rem;
  }

  /* ----------------------------
     Inputs, Textareas, Selects
  ----------------------------- */

  .hbspt-form input[type='checkbox'] {
    cursor: pointer;
  }

  .hbspt-form input:not([type='checkbox']):not([type='submit']),
  .hbspt-form textarea,
  .hbspt-form select {
    width: 100% !important;
    padding: 0.625rem 1rem;
    border-radius: var(--_ui-styles---radius--medium);
    border: var(--_ui-styles---stroke--border-width) solid var(--_primitives---opacity--white-16);
  }

  .hubspot-form select::after {
    content: '';
    position: absolute;
    top: 50%;
    right: 1rem;
    transform: translateY(-50%);
    width: 16px; /* Adjust size as needed */
    height: 16px; /* Adjust size as needed */
    background-image: url('https://cdn.prod.website-files.com/67e6b7885e182e1054b556db/68273a3b5858b04ba78f627f_arrow-down.svg');
    background-size: contain;
    background-repeat: no-repeat;
    pointer-events: none; /* Allows clicks to pass through to the select element */
  }

  .hbspt-form input::placeholder,
  .hbspt-form textarea::placeholder,
  .hbspt-form select::placeholder,
  .hbspt-form select.is-placeholder {
    color: var(--text--tertiary);
  }

  .hbspt-form input:not([type='checkbox']) {
    height: 2.75rem;
  }

  .hbspt-form input[type='checkbox'] {
    width: 1.125rem;
    height: 1.125rem;
    flex-shrink: 0;
    border-radius: var(--_ui-styles---radius--medium);
    border: var(--_ui-styles---stroke--border-width) solid var(--_primitives---opacity--white-16);
  }

  /* ----------------------------
     Labels & Required Indicators
  ----------------------------- */
  .hbspt-form label {
    display: flex;
    justify-content: space-between;
    align-items: start;
    font-size: 1rem;
    font-weight: 400;
    line-height: 150%;
    letter-spacing: -0.02rem;
    color: var(--text--primary);
  }

  .hubspot-form:not(.is-ebook):not(.is-articles) .hbspt-form .hs-form-required {
    font-family: Firacode, Arial, sans-serif;
    font-size: 0.75rem;
    font-weight: 500;
    line-height: 120%;
    letter-spacing: -0.03rem;
    text-transform: uppercase;
    color: var(--text--secondary);
  }

  .hbspt-form .hs-form-required::after {
    content: ' Required';
  }

  ul.hs-error-msgs.inputs-list {
    display: none;
  }

  .legal-consent-container:has(.hs-error-msgs.inputs-list) .hs-input[type='checkbox'] {
    outline: 1px solid var(--_primitives---colors--red);
  }

  /* ----------------------------
     Error & Legal Consent
  ----------------------------- */
  .hbspt-form .hs-error-msgs label,
  .hbspt-form .hs-error-msgs ul {
    margin: 0;
    padding: 0;
    font-family: var(--_typography---font-styles--extra);
    font-size: 0.75rem;
    font-weight: 500;
    line-height: 120%;
    letter-spacing: -0.03rem;
    text-transform: uppercase;
    color: var(--_primitives---colors--red);
  }

  .hbspt-form .hs-input.invalid.error {
    border-color: var(--_primitives---colors--red);
  }

  .hbspt-form .legal-consent-container {
    font-size: 0.75rem;
    font-weight: 400;
    line-height: 150%;
    letter-spacing: -0.015rem;
    color: var(--text--secondary);
  }

  .hbspt-form .legal-consent-container a {
    text-decoration: underline;
  }

  .legal-consent-container .field.hs-form-field {
    margin: 0;
  }

  .hbspt-form .hs-form-booleancheckbox span {
    font-size: 0.75rem;
    color: var(--text--secondary);
  }

  /* ----------------------------
     List Styling
  ----------------------------- */
  .hbspt-form ul {
    margin: 0;
    padding: 0;
  }

  .hbspt-form li {
    margin-top: 0.5rem;
    padding-left: 0;
  }

  .hbspt-form ul {
    list-style: none;
    padding-left: 0;
    margin-left: 0;
  }

  /* ----------------------------
     Buttons
  ----------------------------- */
  .hbspt-form .button {
    width: 100%;
  }

  /* ----------------------------
     Actions (with icon)
  ----------------------------- */

    position: relative;
    cursor: pointer;
