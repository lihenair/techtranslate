name: Article tools

on:
  push:
    branches: [master]
    paths:
      - scripts/**
      - tests/**
      - .github/workflows/article-tools.yml
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: python3 -m unittest tests.test_article_tools tests.test_translation_format tests.test_capture_media tests.test_translation_archive -v
