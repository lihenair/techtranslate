name: Article tools

on:
  push:
    paths:
      - scripts/article_tools.py
      - tests/test_article_tools.py
      - .github/workflows/article-tools.yml
  pull_request:
    paths:
      - scripts/article_tools.py
      - tests/test_article_tools.py
      - .github/workflows/article-tools.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: python3 -m unittest tests/test_article_tools.py -v
